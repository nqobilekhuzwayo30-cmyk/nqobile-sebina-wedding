<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nqobile and Sebina Wedding</title>

<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:title" content="Nqobile & Sebina Wedding">
<meta property="og:description" content="Join us as we celebrate our wedding on March 27, 2026">
<meta property="og:image" content="https://raw.githubusercontent.com/nqobilekhuzwayo30-cmyk/nqobile-sebina-wedding/main/share.png">
<meta property="og:url" content="https://nqobilekhuzwayo30-cmyk.github.io/nqobile-sebina-wedding/">
<meta property="og:type" content="website">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Cormorant+Garamond:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{font-family:"Cormorant Garamond",serif;background:linear-gradient(135deg,#f7f2f3,#e8d9cf);min-height:100vh;overflow-x:hidden}
.navbar{background:rgba(255,255,255,0.95);backdrop-filter:blur(16px);padding:18px 0;position:sticky;top:0;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.1);z-index:10}
.logo{font-family:"Dancing Script",cursive;font-size:2.4rem;color:#d8b384;font-weight:700}
.container{max-width:1200px;margin:auto;padding:24px}

.hero-card{background:rgba(255,255,255,0.85);border-radius:24px;padding:40px 24px;text-align:center;box-shadow:0 35px 90px rgba(0,0,0,0.3);animation:floatSlow 8s ease-in-out infinite;margin-bottom:50px}
.hero-names{font-family:"Dancing Script",cursive;font-size:clamp(4rem,12vw,6rem);color:#2c1f1e}
.hero-date{font-size:2rem;color:#d8b384;margin:20px 0 40px}
.invite-video{width:100%;max-width:820px;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,0.3);animation:floatSlow 9s ease-in-out infinite}

.countdown-card{text-align:center;margin-bottom:50px}
.countdown-title{display:inline-block;font-family:"Playfair Display",serif;font-size:2.4rem;border:2px solid #d8b384;border-radius:14px;padding:12px 24px;margin-bottom:20px;animation:floatHeader 6s ease-in-out infinite}
.countdown{display:flex;justify-content:center;gap:24px;flex-wrap:wrap}
.countdown-item{background:rgba(255,255,255,0.85);padding:26px 22px;border-radius:20px;min-width:120px;box-shadow:0 30px 80px rgba(0,0,0,0.3);animation:floatSlow 8s ease-in-out infinite}
.countdown-number{font-size:2.6rem;font-weight:bold;color:#d8b384}
.countdown-label{font-size:0.9rem;text-transform:uppercase;color:#666}

.section-card,.map-container,.qna,.thank-you,.rsvp-card{background:rgba(255,255,255,0.85);border-radius:20px;padding:25px;margin-bottom:50px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,0.3);animation:floatSlow 9s ease-in-out infinite}
.header-box{display:inline-block;border:2px solid #d8b384;border-radius:14px;padding:14px 20px;font-family:"Playfair Display",serif;font-size:2rem;margin-bottom:25px;animation:floatHeader 6s ease-in-out infinite;color:#d8b384}

/* FIX: Wedding Talk and Reception headers black */
.map-container .header-box{
color:#000;
}

.map-frame{position:relative;border-radius:22px;overflow:hidden;border:2px solid #d8b384;box-shadow:inset 0 0 0 1px rgba(216,179,132,0.4),0 25px 60px rgba(0,0,0,0.35)}
.map-frame::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.08),rgba(0,0,0,0.15));pointer-events:none}
.map-frame iframe{width:100%;height:320px;border:0;border-radius:20px}

.address{margin-top:18px;font-size:20px;line-height:1.6}
.address a{color:#2c1f1e;text-decoration:none;border-bottom:1px solid #d8b384}
.time{font-weight:bold;color:#d8b384}

.rsvp-card input,.rsvp-card textarea{width:100%;padding:14px;margin:10px 0;border-radius:10px;border:none}
.rsvp-card button,.wa-button{width:100%;padding:16px;border:none;border-radius:40px;background:#d8b384;font-size:16px;cursor:pointer}

.success{display:none;padding:20px;color:#b89b5e}

.qa-item{margin-bottom:30px}
.qa-item .card{background:#fff;padding:18px 22px;border-radius:12px;box-shadow:0 5px 15px rgba(0,0,0,0.1)}
.qa-item h3{color:#d8b384;font-family:"Playfair Display",serif;margin-bottom:0;font-size:1.2rem;cursor:pointer}
.qa-item .answer{padding-top:8px;font-size:1rem;color:#333;display:none;text-align:center}

.footer{text-align:center;padding:30px;opacity:0.7}

#invitePopup{position:fixed;inset:0;background:rgba(0,0,0,0.35);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:999;opacity:0;visibility:hidden}
#invitePopup.show{opacity:1;visibility:visible}
#invitePopup.fade-out{opacity:0;transition:0.8s}
.popup-content{background:#fff;border-radius:26px;padding:40px 30px;text-align:center;max-width:420px;box-shadow:0 40px 120px rgba(0,0,0,0.35)}
.popup-content h2{font-family:"Dancing Script",cursive;font-size:3rem;color:#d8b384}
.popup-content p{margin-top:14px;font-size:1.2rem;color:#555}

@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-8px)}100%{transform:translateY(0)}}
@keyframes floatHeader{0%{transform:translateY(0)}50%{transform:translateY(-4px)}100%{transform:translateY(0)}}
</style>
</head>
<body>
