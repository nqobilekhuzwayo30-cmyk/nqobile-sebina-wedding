<!DOCTYPE html> <html lang="en"> <head> <meta charset="utf-8"> <title>Nqobile and Sebina Wedding</title> <link rel="icon" type="image/png" href="favicon.png"> <link rel="apple-touch-icon" href="favicon.png"> <meta name="viewport" content="width=device-width, initial-scale=1"> <meta property="og:title" content="Nqobile & Sebina Wedding"> <meta property="og:description" content="Join us as we celebrate our wedding on March 27, 2026"> <meta property="og:image" content="https://raw.githubusercontent.com/nqobilekhuzwayo30-cmyk/nqobile-sebina-wedding/main/share.png"> <meta property="og:url" content="https://nqobilekhuzwayo30-cmyk.github.io/nqobile-sebina-wedding/"> <meta property="og:type" content="website"> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Cormorant+Garamond:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet"> <style> *{margin:0;padding:0;box-sizing:border-box;scroll-behavior:smooth} body{ font-family:"Cormorant Garamond",serif; background:linear-gradient(135deg,#f7f2f3,#e8d9cf); min-height:100vh; overflow-x:hidden } .navbar{ background:rgba(255,255,255,0.95); padding:18px; position:sticky; top:0; text-align:center; z-index:10 } .logo{ font-family:"Dancing Script",cursive; font-size:2.4rem; color:#d8b384 } .container{ max-width:1200px; margin:auto; padding:24px } .section, .hero-card, .rsvp-card, .qna, .faq-card, .thank-you, .map-card{ background:rgba(255,255,255,0.85); border-radius:24px; padding:40px 24px; margin-bottom:50px; text-align:center; box-shadow:0 30px 80px rgba(0,0,0,0.25) } .hero-names{ font-family:"Dancing Script",cursive; font-size:clamp(4rem,12vw,6rem); color:#2c1f1e } .hero-date{ font-size:2rem; color:#d8b384; margin:20px 0 } .countdown{ font-size:1.5rem; margin-bottom:30px; color:#333 } .invite-video{ width:100%; max-width:820px; border-radius:18px } .header-box{ display:inline-block; border:2px solid #d8b384; border-radius:14px; padding:12px 20px; font-family:"Playfair Display",serif; font-size:2rem; margin-bottom:25px } .qa-item{ margin-bottom:18px } .qa-item h3{ color:#d8b384; font-family:"Playfair Display",serif; font-size:1.2rem; cursor:pointer } .answer{ display:none; padding-top:10px; font-size:1rem; color:#333 } button{ width:100%; padding:16px; border:none; border-radius:40px; background:#d8b384; font-size:16px; cursor:pointer } .rsvp-card input, .rsvp-card textarea{ width:100%; padding:14px; margin:10px 0; border-radius:10px; border:none } .success{ display:none; margin-top:20px } .invite-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.35); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; z-index:999 } .invite-popup{ background:#fff; border-radius:26px; padding:40px 30px; text-align:center; max-width:420px; animation:popupIn 0.9s ease forwards } .invite-popup h2{ font-family:"Dancing Script",cursive; font-size:3rem; color:#d8b384 } @keyframes popupIn{ 0%{opacity:0;transform:scale(0.85)} 60%{opacity:1;transform:scale(1.05)} 100%{transform:scale(1)} } @keyframes popupOut{ to{opacity:0;transform:scale(0.9)} } .footer{ text-align:center; padding:30px; opacity:0.7 } iframe.map{ width:100%; height:350px; border:0; border-radius:18px } </style> </head> <body> <div class="invite-overlay" id="inviteOverlay"> <div class="invite-popup" id="invitePopup"> <h2>You’re Invited</h2> <p>Nqobile and Sebina request the honor of your presence.</p> </div> </div> <nav class="navbar"> <div class="logo">Nqobile <i class="fas fa-heart"></i> Sebina</div> </nav> <div class="container"> <div class="hero-card"> <h1 class="hero-names">Nqobile & Sebina</h1> <p class="hero-date">Friday, March 27, 2026</p> <div class="countdown" id="countdown"></div> <video autoplay muted loop playsinline class="invite-video"> <source src="vid.mp4" type="video/mp4"> </video> </div> <div class="map-card"> <div class="header-box">Venue Location</div> <iframe class="map" src="https://www.google.com/maps?q=Durban%20South%20Africa&output=embed"> </iframe> </div> <div class="rsvp-card"> <div class="header-box">RSVP</div> <form action="https://docs.google.com/forms/d/e/1FAIpQLScNfgJbch0Xz2KU7RaLt58EaeB2QoEcxtvL7_S8GzjflThXqg/formResponse" method="POST" target="hidden_iframe" onsubmit="submittedRSVP=true;setTimeout(showRSVPThankYou,600);"> <input name="entry.994600838" placeholder="Full Name" required> <input name="entry.793758707" placeholder="Phone Number" required> <input name="entry.458040034" value="1" readonly> <textarea name="entry.282977896" placeholder="Message"></textarea> <button type="submit">Send RSVP</button> </form> <iframe name="hidden_iframe" style="display:none"></iframe> <div id="rsvpSuccess" class="success"> <h2>Thank you</h2> <p>Your RSVP has been received.</p> </div> </div> <footer class="footer"> Made with love by Nqobile and Sebina </footer> </div> <script> document.querySelectorAll(".qa-item h3").forEach(function(q){ q.addEventListener("click",function(){ var a=q.nextElementSibling; a.style.display=a.style.display==="block"?"none":"block"; }); }); var submittedRSVP=false; function showRSVPThankYou(){ if(submittedRSVP){ document.querySelector(".rsvp-card form").style.display="none"; document.getElementById("rsvpSuccess").style.display="block"; } } var targetDate=new Date("March 27, 2026 00:00:00").getTime(); var countdownEl=document.getElementById("countdown"); setInterval(function(){ var now=new Date().getTime(); var diff=targetDate-now; if(diff<=0){ countdownEl.innerHTML="The wedding has started"; return; } var d=Math.floor(diff/(1000*60*60*24)); var h=Math.floor((diff%(1000*60*60*24))/(1000*60*60)); var m=Math.floor((diff%(1000*60*60))/(1000*60)); var s=Math.floor((diff%(1000*60))/1000); countdownEl.innerHTML=d+" days "+h+" hours "+m+" minutes "+s+" seconds"; },1000); setTimeout(function(){ document.getElementById("invitePopup").style.animation="popupOut 0.6s ease forwards"; setTimeout(function(){ document.getElementById("inviteOverlay").style.display="none"; },600); },5000); </script> </body> </html>
