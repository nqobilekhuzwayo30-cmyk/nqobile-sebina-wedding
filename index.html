<style>
/* [Previous styles unchanged until photo section - keeping countdown squares perfect] */
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html{font-size:18px}@media (max-width:768px){html{font-size:16px}}
body{font-family:"Cormorant Garamond",serif;background:linear-gradient(135deg,#f7f2f3,#e8d9cf);min-height:100vh;overflow-x:hidden;line-height:1.65;-webkit-font-smoothing:antialiased}

.navbar{background:rgba(255,255,255,0.98);backdrop-filter:blur(20px);padding:20px 0;position:sticky;top:0;text-align:center;box-shadow:0 4px 25px rgba(0,0,0,0.15);z-index:100}
.logo{font-family:"Dancing Script",cursive;font-size:clamp(2.1rem,7vw,2.8rem);color:#d8b384;font-weight:700;padding:14px}

.container{max-width:100%;margin:0 auto;padding:20px 26px 26px}@media (min-width:768px){.container{max-width:1200px;padding:30px}}

.hero-card{background:rgba(255,255,255,0.9);border-radius:20px;padding:38px 26px;text-align:center;box-shadow:0 25px 70px rgba(0,0,0,0.25);margin-bottom:48px;animation:floatSlow 8s ease-in-out infinite}
.hero-names{font-family:"Dancing Script",cursive;font-size:clamp(3.5rem,13.5vw,7rem);color:#2c1f1e;margin-bottom:20px;line-height:1.1}
.hero-date{font-size:clamp(1.6rem,4.8vw,2.4rem);color:#d8b384;margin:28px 0 38px}
.invite-video{width:100%;max-width:100%;height:auto;border-radius:16px;box-shadow:0 25px 60px rgba(0,0,0,0.3);animation:floatSlow 9s ease-in-out infinite}

.countdown-card{text-align:center;margin-bottom:48px}
.countdown-title{display:inline-block;font-family:"Playfair Display",serif;font-size:clamp(1.9rem,6vw,2.8rem);border:2px solid #d8b384;border-radius:12px;padding:16px 26px;margin-bottom:28px;animation:floatHeader 6s ease-in-out infinite}
.countdown{display:grid;grid-template-columns:repeat(4, 1fr);gap:16px;justify-items:center;margin-top:20px}@media (max-width:500px){.countdown{grid-template-columns:repeat(2, 1fr);gap:12px}}
.countdown-item{background:rgba(255,255,255,0.9);width:100%;min-height:110px;padding:20px 12px;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,0.25);animation:floatSlow 8s ease-in-out infinite;display:flex;flex-direction:column;justify-content:center;align-items:center}
.countdown-number{font-size:clamp(1.9rem,7.5vw,3.1rem);font-weight:bold;color:#d8b384;line-height:1;margin-bottom:4px}
.countdown-label{font-size:0.95rem;text-transform:uppercase;color:#666;font-weight:500;letter-spacing:0.5px}

.header-box{display:inline-block;border:2px solid #d8b384;border-radius:12px;padding:16px 24px;font-family:"Playfair Display",serif;font-size:clamp(1.6rem,5vw,2.4rem);margin-bottom:28px;animation:floatHeader 6s ease-in-out infinite;color:#2c1f1e}
.map-container .header-box{color:#000}
.map-container,.qna,.faq,.thank-you,.rsvp-card,.registry-card{background:rgba(255,255,255,0.9);border-radius:18px;padding:32px;margin-bottom:48px;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,0.25);animation:floatSlow 9s ease-in-out infinite}
.map-frame{position:relative;border-radius:18px;overflow:hidden;border:2px solid #d8b384;box-shadow:inset 0 0 0 1px rgba(216,179,132,0.4),0 20px 50px rgba(0,0,0,0.3);margin:20px 0}
.map-frame::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.08),rgba(0,0,0,0.15));pointer-events:none}
.map-frame iframe{width:100%;height:clamp(300px,44vw,370px);border:0;border-radius:16px;display:block}
.address{margin-top:20px;font-size:clamp(1.2rem,4vw,1.4rem);line-height:1.75}
.time{font-weight:bold;color:#d8b384}

.rsvp-card input,.rsvp-card textarea{width:100%;padding:20px;margin:16px 0;border-radius:12px;border:1px solid #ddd;background:rgba(255,255,255,0.8);font-size:18px;font-family:inherit}
.rsvp-card textarea{min-height:120px}

.rsvp-card button,.registry-button{width:100%;padding:22px;border:none;border-radius:35px;background:#d8b384;font-size:clamp(1.2rem,4.5vw,1.3rem);cursor:pointer;color:white;text-decoration:none;display:block;margin:16px 0;font-family:"Playfair Display",serif;font-weight:600;transition:all 0.3s ease;min-height:64px;text-align:center}
.rsvp-card button:hover,.registry-button:hover,.qr-link:hover,.drive-button:hover{transform:translateY(-2px);box-shadow:0 15px 40px rgba(216,179,132,0.4)}
.photo-buttons{display:grid;grid-template-columns:1fr;gap:16px;margin:32px 0}@media (min-width:500px){.photo-buttons{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}}
.photo-buttons .registry-button{padding:20px;font-size:1.2rem}

.qr-link{display:inline-block;transition:transform 0.3s ease;margin-bottom:28px}
.qr-link img{width:clamp(240px,55vw,300px);height:clamp(240px,55vw,300px);border-radius:18px;box-shadow:0 25px 70px rgba(0,0,0,0.3);border:4px solid #d8b384;cursor:pointer;max-width:100%}

.success{display:none;padding:28px;color:#b89b5e;border-radius:12px;background:rgba(216,179,132,0.1)}
.qa-item{margin-bottom:32px;padding:28px 0;border-bottom:1px solid rgba(216,179,132,0.3);transition:transform 0.3s ease}@media (hover:hover){.qa-item:hover{transform:translateX(8px)}}
.qa-item:last-child{border-bottom:none}
.qa-item h3{color:#d8b384;font-family:"Playfair Display",serif;font-size:1.4rem;margin-bottom:16px;cursor:pointer}
.qa-item .answer{font-size:1.2rem;line-height:1.85;color:#555;padding-left:14px}

.footer{text-align:center;padding:38px 26px;opacity:0.7;font-size:1.05rem}

/* ANIMATIONS */
@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-6px)}100%{transform:translateY(0)}}
@keyframes floatHeader{0%{transform:translateY(0)}50%{transform:translateY(-3px)}100%{transform:translateY(0)}}

.invite-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:999;opacity:0;animation:overlayIn 0.6s forwards;padding:26px}
.invite-popup{background:#fff;border-radius:22px;padding:clamp(30px,10vw,48px) 30px;text-align:center;max-width:90vw;max-height:90vh;overflow-y:auto;box-shadow:0 40px 120px rgba(0,0,0,0.4);transform:scale(0.9);animation:popupIn 0.8s forwards}
.invite-popup h2{font-family:"Dancing Script",cursive;font-size:clamp(2.4rem,12vw,3.6rem);color:#d8b384 !important;margin-bottom:20px}
.invite-popup p{font-size:clamp(1.2rem,5vw,1.4rem);color:#555}
@keyframes popupIn{0%{transform:scale(0.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes overlayIn{to{opacity:1}}
.fade-out{animation:popupOut 0.8s forwards}
@keyframes popupOut{to{opacity:0;transform:scale(1.05)}}

@supports (-webkit-touch-callout: none) {
  .rsvp-card input, .rsvp-card textarea {-webkit-appearance:none}
  .registry-button, .drive-button {-webkit-appearance:none;-webkit-tap-highlight-color:transparent}
}
</style>

<script>
const weddingDate = new Date("2026-03-27T13:00:00").getTime()
const days = document.getElementById("days")
const hours = document.getElementById("hours")
const minutes = document.getElementById("minutes")
const seconds = document.getElementById("seconds")
setInterval(() => {
const diff = weddingDate - Date.now()
if (diff <= 0) {
days.textContent=0;hours.textContent=0;minutes.textContent=0;seconds.textContent=0
document.getElementById("countdownTitle").textContent="Wedding Day!"
return
}
days.textContent = Math.floor(diff / 86400000)
hours.textContent = Math.floor((diff / 3600000) % 24)
minutes.textContent = Math.floor((diff / 60000) % 60)
seconds.textContent = Math.floor((diff / 1000) % 60)
}, 1000)
